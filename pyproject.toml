[project]
name = "nitrokey-udev-rules"
requires-python = ">=3.11"

[dependency-groups]
dev = [
    "ruff >=0.17, <0.18",
    "ty ==0.0.95",
]

[tool.poetry]
package-mode = false

[tool.ruff]
line-length = 100

[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.ruff.lint]
select = ["ANN", "B", "C", "E", "F", "W", "I", "RUF100"]
ignore = ["E501"]

[tool.ruff.lint.isort]
split-on-trailing-comma = false
