name: Continuous integration
on: [push, pull_request]

jobs:
  verify-lockfile:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: gh extension install github/gh-actions-lock --pin v0.4.1
      - run: gh actions-lock --verify

  check:
    name: Run checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - uses: actions/setup-python@v7
      - name: Install dependencies
        run: |
          pip install poetry
          poetry install
      - name: Run checks
        run: make check RUFF="poetry run ruff" TY="poetry run ty"

  verify:
    name: Verify rules
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Verify rules
        run: make verify
        
  rebuild:
    name: Rebuild rules
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - uses: actions/setup-python@v7
      - name: Rebuild rules
        run: |
          cp 41-nitrokey.rules original
          cp 41-nitrokey-plugdev.rules original-plugdev
          make generate
          diff original 41-nitrokey.rules
          diff original-plugdev 41-nitrokey-plugdev.rules
